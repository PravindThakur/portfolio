    <script>

        const jobsContainer =
            document.getElementById("jobsContainer");

        const searchStatus =
            document.getElementById("searchStatus");


        function escapeHtml(value) {

            if (!value) return "";

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        function renderJobs(jobs) {

            if (!jobs || jobs.length === 0) {

                jobsContainer.innerHTML = `

                    <div class="card shadow rounded-4 border-0">

                        <div class="card-body p-5 text-center">

                            <i class="bi bi-search fs-1 text-muted"></i>

                            <h3 class="fw-bolder mt-3">
                                No jobs found
                            </h3>

                            <p class="text-muted mb-0">
                                No matching opportunities were found at the moment.
                            </p>

                        </div>

                    </div>

                `;

                return;
            }


            /*
             * Sort strictly by posting time.
             *
             * LinkedIn returns the jobs in posting order,
             * but we keep the explicit sort here so that the
             * newest jobs always appear first.
             */

            jobs.sort((a, b) => {

                const dateA =
                    new Date(a.postedAt || 0).getTime();

                const dateB =
                    new Date(b.postedAt || 0).getTime();

                return dateB - dateA;

            });


            jobsContainer.innerHTML = jobs.map((job, index) => {

                return `

                    <div class="card overflow-hidden shadow rounded-4 border-0 mb-4 job-card">

                        <div class="card-body p-4 p-md-5">

                            <div class="d-flex align-items-start gap-3">

                                <div class="job-number">
                                    ${index + 1}
                                </div>


                                <div class="flex-grow-1">

                                    <h2 class="fw-bolder fs-4 mb-2">

                                        <a
                                            class="job-title"
                                            href="${escapeHtml(job.url)}"
                                            target="_blank"
                                            rel="noopener">

                                            ${escapeHtml(job.title)}

                                        </a>

                                    </h2>


                                    <div class="job-meta mb-2">

                                        <i class="bi bi-building me-1"></i>

                                        ${escapeHtml(job.company)}

                                    </div>


                                    <div class="job-meta mb-2">

                                        <i class="bi bi-geo-alt me-1"></i>

                                        ${escapeHtml(job.location)}

                                    </div>


                                    <div class="job-meta">

                                        <i class="bi bi-clock me-1"></i>

                                        <strong>
                                            ${escapeHtml(job.posted)}
                                        </strong>

                                    </div>


                                    <div class="mt-4">

                                        <a
                                            class="btn btn-outline-dark"
                                            href="${escapeHtml(job.url)}"
                                            target="_blank"
                                            rel="noopener">

                                            <i class="bi bi-linkedin me-2"></i>

                                            View Job on LinkedIn

                                        </a>

                                    </div>

                                </div>

                            </div>

                        </div>

                    </div>

                `;

            }).join("");

        }


        async function searchJobs() {

            searchStatus.innerHTML = `

                <span
                    class="spinner-border loading-spinner me-2"
                    role="status">
                </span>

                Fetching latest jobs...

            `;

            jobsContainer.innerHTML = "";


            try {

                /*
                 * These are the predefined skills/profile keywords.
                 *
                 * No search controls are exposed to the visitor.
                 */

                const keywords =
                    "Corporate Actions Reference Data Capital Markets Trade Settlement Asset Servicing Business Analyst Production Support SQL SWIFT";


                const location =
                    "India";


                const timeValue =
                    7;


                const timeUnit =
                    "days";


                const sort =
                    "newest";


                const params =
                    new URLSearchParams({

                        keywords,
                        location,
                        timeValue,
                        timeUnit,
                        sort

                    });


                const response =
                    await fetch(
                        `/api/jobs?${params.toString()}`
                    );


                const data =
                    await response.json();


                if (!data.success) {

                    throw new Error(
                        data.error || "Unable to load jobs"
                    );

                }


                const jobs =
                    data.jobs || [];


                renderJobs(jobs);


                searchStatus.innerHTML = `

                    <span class="text-success fw-bold">

                        <i class="bi bi-check-circle me-1"></i>

                        ${jobs.length} latest jobs

                    </span>

                    <span class="text-muted">

                        &nbsp;•&nbsp; Updated automatically

                    </span>

                `;

            } catch (error) {

                console.error(error);


                searchStatus.innerHTML = `

                    <span class="text-danger fw-bold">

                        <i class="bi bi-exclamation-circle me-1"></i>

                        Unable to load latest jobs

                    </span>

                `;


                jobsContainer.innerHTML = `

                    <div class="card shadow rounded-4 border-0">

                        <div class="card-body p-5 text-center">

                            <i class="bi bi-exclamation-triangle fs-1 text-warning"></i>

                            <h3 class="fw-bolder mt-3">
                                Jobs temporarily unavailable
                            </h3>

                            <p class="text-muted mb-0">
                                Please try again later.
                            </p>

                        </div>

                    </div>

                `;

            }

        }


        /*
         * Automatically fetch jobs when the page opens.
         */
        searchJobs();

    </script>

</body>
