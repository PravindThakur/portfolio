    <script>

        const form = document.getElementById("jobSearchForm");
        const jobsContainer = document.getElementById("jobsContainer");
        const searchStatus = document.getElementById("searchStatus");


        function escapeHtml(value) {

            if (!value) return "";

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }


        function getMatchClass(level) {

            switch (level) {

                case "Excellent":
                    return "match-excellent";

                case "Strong":
                    return "match-strong";

                case "Good":
                    return "match-good";

                case "Moderate":
                    return "match-moderate";

                default:
                    return "match-low";
            }
        }


        function renderJobs(jobs) {

            if (!jobs || jobs.length === 0) {

                jobsContainer.innerHTML = `
                    <div class="card shadow rounded-4 border-0">
                        <div class="card-body p-5 text-center">
                            <i class="bi bi-search fs-1 text-muted"></i>
                            <h3 class="fw-bolder mt-3">No jobs found</h3>
                            <p class="text-muted mb-0">
                                Try changing your keywords, location or posted time.
                            </p>
                        </div>
                    </div>
                `;

                return;
            }


            jobsContainer.innerHTML = jobs.map(job => {

                const matchedSkills =
                    job.matchedSkills || [];

                const skillHtml =
                    matchedSkills.length > 0
                        ? matchedSkills.map(skill =>
                            `<span class="badge bg-light text-dark border">${escapeHtml(skill)}</span>`
                          ).join("")
                        : "";


                const snippet =
                    job.snippet
                        ? `<p class="text-muted mb-3">${escapeHtml(job.snippet)}</p>`
                        : "";


                return `

                    <div class="card overflow-hidden shadow rounded-4 border-0 mb-4 job-card">

                        <div class="card-body p-4 p-md-5">

                            <div class="d-flex flex-column flex-md-row justify-content-between align-items-start gap-3">

                                <div class="flex-grow-1">

                                    <h2 class="fw-bolder fs-4 mb-2">

                                        <a
                                            class="job-title"
                                            href="${escapeHtml(job.url)}"
                                            target="_blank"
                                            rel="noopener">

                                            ${escapeHtml(job.title)}

                                        </a>

                                    </h2>


                                    <div class="job-meta mb-2">

                                        <i class="bi bi-building me-1"></i>
                                        ${escapeHtml(job.company)}

                                    </div>


                                    <div class="job-meta mb-2">

                                        <i class="bi bi-geo-alt me-1"></i>
                                        ${escapeHtml(job.location)}

                                    </div>


                                    <div class="job-meta">

                                        <i class="bi bi-clock me-1"></i>
                                        ${escapeHtml(job.posted)}

                                    </div>

                                </div>


                                <div class="text-md-end">

                                    <span class="match-badge ${getMatchClass(job.matchLevel)}">

                                        ${escapeHtml(job.matchScore)}% Match

                                    </span>

                                    <div class="small text-muted mt-2">

                                        ${escapeHtml(job.matchLevel)}

                                    </div>

                                </div>

                            </div>


                            ${snippet}


                            ${
                                matchedSkills.length > 0
                                ? `
                                    <div class="job-skills mt-3">

                                        <div class="small fw-bold text-muted mb-2">
                                            Matched Skills
                                        </div>

                                        ${skillHtml}

                                    </div>
                                  `
                                : ""
                            }


                            <div class="mt-4">

                                <a
                                    class="btn btn-outline-dark"
                                    href="${escapeHtml(job.url)}"
                                    target="_blank"
                                    rel="noopener">

                                    <i class="bi bi-linkedin me-2"></i>
                                    View on LinkedIn

                                </a>

                            </div>

                        </div>

                    </div>

                `;

            }).join("");
        }


        async function searchJobs() {

            const keywords =
                document.getElementById("keywords").value.trim();

            const location =
                document.getElementById("location").value.trim();

            const timeValue =
                document.getElementById("timeValue").value;

            const timeUnit =
                document.getElementById("timeUnit").value;

            const sort =
                document.getElementById("sort").value;


            const workplace =
                [...document.querySelectorAll(".workplace:checked")]
                .map(el => el.value)
                .join(",");


            const skills =
                [...document.querySelectorAll(".skill:checked")]
                .map(el => el.value)
                .join(",");


            searchStatus.innerHTML = `
                <span class="spinner-border loading-spinner me-2" role="status"></span>
                Searching latest jobs...
            `;


            jobsContainer.innerHTML = "";


            try {

                const params = new URLSearchParams({

                    keywords,
                    location,
                    timeValue,
                    timeUnit,
                    workplace,
                    skills,
                    sort

                });


                const response =
                    await fetch(`/api/jobs?${params.toString()}`);


                const data =
                    await response.json();


                if (!data.success) {

                    throw new Error(
                        data.error || "Unable to load jobs"
                    );

                }


                let jobs =
                    data.jobs || [];


                /*
                 * The backend already calculates the match score.
                 * Sort by match score for the most useful result first.
                 */

                jobs.sort(
                    (a, b) =>
                        (b.matchScore || 0) -
                        (a.matchScore || 0)
                );


                renderJobs(jobs);


                searchStatus.innerHTML = `

                    <span class="text-success fw-bold">

                        <i class="bi bi-check-circle me-1"></i>

                        ${jobs.length} jobs found

                    </span>

                    <span class="text-muted">

                        &nbsp;•&nbsp; Results automatically matched to my profile

                    </span>

                `;

            } catch (error) {

                console.error(error);

                searchStatus.innerHTML = `

                    <span class="text-danger fw-bold">

                        <i class="bi bi-exclamation-circle me-1"></i>

                        Something went wrong

                    </span>

                `;

                jobsContainer.innerHTML = `

                    <div class="card shadow rounded-4 border-0">

                        <div class="card-body p-5 text-center">

                            <i class="bi bi-exclamation-triangle fs-1 text-warning"></i>

                            <h3 class="fw-bolder mt-3">
                                Unable to load jobs
                            </h3>

                            <p class="text-muted">
                                LinkedIn may be temporarily unavailable.
                                Please try again later.
                            </p>

                        </div>

                    </div>

                `;

            }

        }


        form.addEventListener("submit", function(event) {

            event.preventDefault();

            searchJobs();

        });


        /*
         * Automatically search when the Jobs page opens.
         */
        searchJobs();

    </script>
