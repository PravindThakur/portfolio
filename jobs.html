<script>

const jobsContainer =
    document.getElementById(
        "jobsContainer"
    );


const searchStatus =
    document.getElementById(
        "searchStatus"
    );



/*
 * Escape HTML
 */

function escapeHtml(
    value
) {

    if (!value) {
        return "";
    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



/*
 * Render jobs
 */

function renderJobs(
    jobs
) {

    if (
        !jobs ||
        jobs.length === 0
    ) {

        jobsContainer.innerHTML = `

            <div
                class="card border-0 shadow-sm rounded-4"
            >

                <div
                    class="card-body py-4 text-center"
                >

                    <i
                        class="bi bi-search text-muted fs-4"
                    ></i>

                    <div
                        class="fw-semibold mt-2"
                    >
                        No jobs found
                    </div>

                    <div
                        class="text-muted small"
                    >
                        No matching opportunities were found.
                    </div>

                </div>

            </div>

        `;

        return;
    }



    /*
     * Always sort newest first.
     */

    jobs.sort(
        (a, b) => {

            const dateA =
                new Date(
                    a.postedAt || 0
                ).getTime();


            const dateB =
                new Date(
                    b.postedAt || 0
                ).getTime();


            return dateB - dateA;

        }
    );



    jobsContainer.innerHTML =

        jobs.map(
            job => {

                return `

                    <div
                        class="card border-0 shadow-sm mb-2 job-card"
                    >

                        <div
                            class="card-body"
                        >

                            <div
                                class="d-flex align-items-center justify-content-between gap-3"
                            >


                                <!-- Job Information -->

                                <div
                                    class="flex-grow-1 min-width-0"
                                >

                                    <div
                                        class="mb-1"
                                    >

                                        <a
                                            class="job-title fw-bold"
                                            href="${escapeHtml(job.url)}"
                                            target="_blank"
                                            rel="noopener noreferrer"
                                        >

                                            ${escapeHtml(job.title)}

                                        </a>

                                    </div>


                                    <div
                                        class="job-meta"
                                    >

                                        <span
                                            class="job-company text-dark"
                                        >

                                            ${escapeHtml(job.company)}

                                        </span>


                                        <span
                                            class="job-separator"
                                        >
                                            ·
                                        </span>


                                        <span>
                                            ${escapeHtml(job.location || "India")}
                                        </span>


                                        <span
                                            class="job-separator"
                                        >
                                            ·
                                        </span>


                                        <span>
                                            ${escapeHtml(job.posted)}
                                        </span>

                                    </div>

                                </div>



                                <!-- LinkedIn -->

                                <div>

                                    <a
                                        class="job-link text-dark"
                                        href="${escapeHtml(job.url)}"
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        title="View job on LinkedIn"
                                    >

                                        <i
                                            class="bi bi-linkedin me-1"
                                        ></i>

                                        View

                                    </a>

                                </div>


                            </div>

                        </div>

                    </div>

                `;

            }
        ).join("");

}



/*
 * Fetch jobs automatically
 */

async function searchJobs() {

    searchStatus.innerHTML = `

        <span
            class="spinner-border loading-spinner me-2"
            role="status"
        ></span>

        Fetching latest jobs...

    `;


    jobsContainer.innerHTML = "";



    try {


        /*
         * These keywords are predefined.
         *
         * Visitors do not need to search manually.
         */

        const keywords =
            "Corporate Actions Reference Data Capital Markets Trade Settlement Asset Servicing Business Analyst Production Support SQL SWIFT";


        const location =
            "India";


        const timeValue =
            30;


        const timeUnit =
            "days";


        const sort =
            "newest";


        const params =
            new URLSearchParams({

                keywords,
                location,
                timeValue,
                timeUnit,
                sort

            });



        const response =
            await fetch(
                `/api/jobs?${params.toString()}`,
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                `HTTP ${response.status}`
            );

        }



        const data =
            await response.json();



        if (!data.success) {

            throw new Error(
                data.error ||
                "Unable to load jobs"
            );

        }



        const jobs =
            data.jobs || [];



        renderJobs(
            jobs
        );



        searchStatus.innerHTML = `

            <span
                class="text-success fw-semibold"
            >

                <i
                    class="bi bi-check-circle me-1"
                ></i>

                ${jobs.length} jobs

            </span>

            <span
                class="text-muted"
            >

                &nbsp;·&nbsp; Latest first

            </span>

        `;


    } catch (error) {


        console.error(
            error
        );


        searchStatus.innerHTML = `

            <span
                class="text-danger fw-semibold"
            >

                <i
                    class="bi bi-exclamation-circle me-1"
                ></i>

                Unable to load jobs

            </span>

        `;


        jobsContainer.innerHTML = `

            <div
                class="card border-0 shadow-sm rounded-4"
            >

                <div
                    class="card-body py-4 text-center"
                >

                    <i
                        class="bi bi-exclamation-triangle text-warning fs-4"
                    ></i>

                    <div
                        class="fw-semibold mt-2"
                    >
                        Jobs temporarily unavailable
                    </div>

                    <div
                        class="text-muted small"
                    >
                        Please try again later.
                    </div>

                </div>

            </div>

        `;

    }

}



/*
 * Automatically load jobs when page opens.
 */

searchJobs();

</script>
